<div class="exp-container">
  <div class="exp-header">
    <div class="banner-title accent-text">
      {{'exp.title' | translate}}
    </div>
  </div>

  <ol class="exp-timeline">
    <ng-container *ngTemplateOutlet="CompanyTempl; context: {
      data: 'exp.companies.0' | translate,
      cardClass: 'inverse'
    }"></ng-container>
    <ng-container *ngTemplateOutlet="CompanyTempl; context: {
      data: 'exp.companies.1' | translate,
      cardClass: 'inverse'
    }"></ng-container>
    <ng-container *ngTemplateOutlet="CompanyTempl; context: {
      data: 'exp.companies.2' | translate,
      cardClass: ''
    }"></ng-container>

    <li class="exp-stop">
      <div class="exp-stop__meta">
        <span class="exp-stop__years">{{ 'exp.future.label' | translate }}</span>
        <span class="exp-stop__marker exp-stop__marker--future" aria-hidden="true"></span>
      </div>
      <div class="card box-shadow-high inverse">
        <div class="card-img" aria-hidden="true"></div>
        <div class="exp-identity">
          <div
            class="card-title exp-future-role"
            [class.is-flipping]="isFutureFlipping">
            {{ currentFutureRoleKey | translate }}
          </div>
          <div class="exp-company exp-company--placeholder" aria-hidden="true">&nbsp;</div>
        </div>
        <div class="card-description"></div>
      </div>
    </li>
  </ol>
</div>

<ng-template #CompanyTempl let-data="data" let-cardClass="cardClass">
  <li class="exp-stop">
    <div class="exp-stop__meta">
      <span class="exp-stop__years">{{ data.from }} – {{ data.to }}</span>
      <span class="exp-stop__marker" [class.exp-stop__marker--current]="!cardClass" aria-hidden="true"></span>
    </div>
    <div class="card box-shadow-high" [ngClass]="cardClass">
      <div class="card-img">
        <img [src]="companyLogoSrc(data)" [alt]="data.company">
      </div>
      <div class="exp-identity">
        <div class="card-title">{{ data.designation }}</div>
        <div class="exp-company">
          <span>{{ 'exp.at_company' | translate:{ company: data.company } }}</span>
          <a [href]="data.url" target="_blank" rel="noopener noreferrer" class="c-pointer"
            [matTooltip]="'global.open_link_company' | translate" [matTooltipClass]="'text-12'">
            <mat-icon>open_in_new</mat-icon>
          </a>
        </div>
      </div>
      <div class="card-description">
        <div class="card-description__text" [innerHTML]="data.description"></div>
      </div>
    </div>
  </li>
</ng-template>
