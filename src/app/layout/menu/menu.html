@let text = copy();

<div class="scrim" (click)="close()"></div>

<div
  #panel
  class="panel"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="text.a11y.menuLandmark"
  (keydown)="onKeydown($event)"
>
  <ul class="options" role="list">
    @if (scrolled()) {
      <li>
        <button type="button" (click)="goToTop()">
          <app-icon name="arrowUp" />
          <span>{{ text.global.goToTop }}</span>
        </button>
      </li>
    }

    <li>
      <a
        [href]="text.contactInfo.linkedin"
        target="_blank"
        rel="me noopener noreferrer"
        (click)="close()"
      >
        <app-icon name="linkedin" />
        <span>{{ text.global.goToLinkedIn }}</span>
        <span class="visually-hidden">({{ text.a11y.openInNewTab }})</span>
      </a>
    </li>

    <li>
      <button type="button" (click)="copyEmail()">
        <app-icon name="copy" />
        <span>{{ text.global.copyEmail }}</span>
      </button>
    </li>

    <li>
      <a [href]="cvUrl" [attr.download]="cvFilename" (click)="close()">
        <app-icon name="description" />
        <span>{{ text.banner.downloadCv }}</span>
      </a>
    </li>

    @for (locale of otherLocales(); track locale.code) {
      <li>
        <button type="button" [attr.lang]="locale.code" (click)="selectLocale(locale.code)">
          <app-icon name="translate" />
          <span>{{ locale.name }}</span>
        </button>
      </li>
    }

    @for (mode of otherThemes(); track mode) {
      <li>
        <button type="button" (click)="selectTheme(mode)">
          <app-icon [name]="mode" />
          <span>{{ themeLabel(mode) }}</span>
        </button>
      </li>
    }

    <li>
      <button type="button" (click)="close()">
        <app-icon name="close" />
        <span>{{ text.global.close }}</span>
      </button>
    </li>
  </ul>
</div>
