<section class="hero-split" aria-label="Introduction">
  <div class="hero-panel hero-panel--left hero-panel--active hero-animate">
    <div class="hero-photo hero-animate">
      <img
        [ngSrc]="me.photoPath"
        width="280"
        height="280"
        priority
        [alt]="me.name + ' profile photo'"
        class="profile-dp"
      />
    </div>

    <div class="hero-identity hero-animate">
      <p class="hero-pre-title">{{ me.preName }}</p>
      <div class="hero-name-block">
        <h1 class="hero-name">{{ me.displayName }}</h1>

        <div class="hero-social" aria-label="Social links">
          <button
            type="button"
            class="btn-icon btn-icon--on-card"
            (click)="copyEmail()"
            [matTooltip]="me.homeMailLabel"
            matTooltipClass="text-12 tooltip-on-card"
            matTooltipPosition="below"
            [attr.aria-label]="me.homeMailLabel"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
          </button>
          <a
            class="btn-icon btn-icon--on-card"
            [href]="me.linkedin"
            target="_blank"
            rel="noopener noreferrer"
            [matTooltip]="me.socialLabels.linkedin"
            matTooltipClass="text-12 tooltip-on-card"
            matTooltipPosition="below"
            [attr.aria-label]="me.socialLabels.linkedin"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
            </svg>
          </a>
          <a
            class="btn-icon btn-icon--on-card"
            [href]="me.github"
            target="_blank"
            rel="noopener noreferrer"
            [matTooltip]="me.socialLabels.github"
            matTooltipClass="text-12 tooltip-on-card"
            matTooltipPosition="below"
            [attr.aria-label]="me.socialLabels.github"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02A9.58 9.58 0 0 1 12 6.8c.85.004 1.71.115 2.51.337 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5A10 10 0 0 0 22 12 10 10 0 0 0 12 2z" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="hero-panel hero-panel--right hero-animate">
    <div class="hero-role">
      <p class="hero-pre-title">{{ me.preRole }}</p>
      <p class="hero-title">{{ me.homeTitle }}</p>
      <p class="hero-subtitle" [innerHTML]="me.homeSubtitle"></p>
    </div>
  </div>

  <p class="hero-copy-feedback" aria-live="polite">{{ copyFeedback() }}</p>
</section>
