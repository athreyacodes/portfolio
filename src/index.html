<body>

  <!-- auto theme selection -->
  <script>
    (function () {
      try {
        var override = sessionStorage.getItem('portfolio-theme-override');
        if (override === 'dark') {
          document.body.classList.add('color-scheme-dark');
          return;
        }
        if (override === 'light') {
          return;
        }
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.body.classList.add('color-scheme-dark');
        }
      } catch (e) { }
    })();
  </script>

  <!-- wavy background -->
  <div class="wave3-container">
    <div class="blur slow">
      <span></span>

    </div>
  </div>

  <!-- Main app loads -->
