    imagesizes="(max-width: 820px) 160px, 240px" fetchpriority="high">
  <!--
    The full-viewport cloud texture is the largest paint on narrow screens, and
    a CSS background is only discovered once the stylesheet parses. Browsers
    without AVIF skip this on the type hint and take the PNG from the stylesheet.
  -->
  <link rel="preload" as="image" type="image/avif" href="/images/background/cloud3.avif"
    fetchpriority="high">
</head>

<body>
  <!-- Resolve the theme before first paint so hydration never flashes. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio.theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('theme-dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>

  <app-root></app-root>
</body>
