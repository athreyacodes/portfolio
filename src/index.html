<body>

  <!-- auto theme selection + Safari chrome color -->
  <script>
    (function () {
      try {
        var dark = false;
        var override = sessionStorage.getItem('portfolio-theme-override');
        if (override === 'dark') {
          dark = true;
        } else if (override === 'light') {
          dark = false;
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        if (dark) {
          document.body.classList.add('color-scheme-dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }

        var color = dark ? '#050505' : '#eeeeee';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', color);
        }
      } catch (e) { }
    })();
  </script>

  <!-- wavy background: solid sea + blurred sky masks (soft edge, no WebKit dark fringe) -->
  <div class="wave3-container">
    <div class="wave3-sea"></div>
    <div class="wave3-sky blur slow">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Main app loads -->
  <app-root></app-root>
</body>
